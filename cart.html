<!doctype html>

<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 5 Cart Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kavivanar&family=Lumanosimo&family=Marko+One&family=Marmelad&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>

<body>

<header class="top-stuff">
    <div class="containerH">
        <h1 class="site-name-1">Shopping Site</h1>
        <button href="#" class="login">Log In</button>
    </div>
    <nav class="containerN">
        <a href="index.html" class="nav-home">Home</a>
        <a href="#" class="nav-catalog">Catalog</a>
        <a href="cart.html" class="nav-cart u-r-here">Cart</a>
        <a href="faq.html" class="nav-faq">FAQ</a>
    </nav>
</header>

<main>
  <div class="containerS">
    <div class="cart-top">
      <h2 class="c-heading">Shopping Cart</h2>
    </div>
    <div class="cart-card">
      <div class="cart-items">
        <div class="img-fork">
          <div class="center-img">
            <img src="/images/fork.jpg" alt="a single black metal fork">
          </div>
        </div>
        <div class="c-title">
          <p class="c-item-name">Single Black Pure...</p>
        </div>
        <div class="c-buy-one">
          <button class="buy">BUY</button>
        </div>
        <p class="c-item-name buy-price1">$5</p>
        <div class="c-del-one">
          <button class="delete">DELETE</button>
        </div>
        <div class="img-horse">
          <div class="center-img">
            <img src="/images/horse.jpg" alt="a single stuffed horse toy">
          </div>
        </div>
        <div class="c-title2">
          <p class="c-item-name">Soft Brown Horse...</p>
        </div>
        <div class="c-buy-two">
          <button class="buy">BUY</button>
        </div>
        <p class="c-item-name buy-price2">$12</p>
        <div class="c-del-two">
          <button class="delete">DELETE</button>
        </div>
        <div class="c-gimme">
          <button class="buy-all">BUY ALL</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="containerF">
    <h3 class="site-name-2">Shopping Site ©</h3>
    <p class="slogan">All Your Desires, All in One</p>
  </div>
</footer>

</body>
